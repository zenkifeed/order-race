<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Race — chọn trò chơi</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   THEME SÁNG
   Cùng bảng màu sân đấu ở GDD nhưng lật sáng: nền ngả xanh cỏ thay vì đen,
   viền mực gần đen ngả xanh, và đổ bóng cứng không mờ kiểu decal dán.
   Bóng cứng + viền dày mới là thứ tạo ra cảm giác "sticker", không phải màu.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --paper:#eef2ea;  --surface:#ffffff;  --surf-2:#e2ebdd;
  --ink:#12211a;    --ink-2:#465449;    --ink-3:#6f7d72;
  --line:#c7d3c5;
  --turf:#0f7a4f;   --lure:#dd9c0c;     --danger:#bf432a;

  --shadow:0 5px 0 var(--ink);
  --shadow-lg:0 7px 0 var(--ink);

  /* Không bao giờ dùng easing tuyến tính. */
  --ease-pop:cubic-bezier(.34,1.56,.64,1);
  /* Một thang thời gian DUY NHẤT cho cả màn hình. Mọi thứ vào màn đều lấy mốc
     từ --t0, nên đổi nhịp cả trang là đổi một con số, không phải đi lùng tám
     chỗ rồi bỏ sót một chỗ — đúng cái đã làm nhịp vào màn cũ rời rạc. */
  --t0:.24s;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-snap:cubic-bezier(.5,0,.1,1);
}

*{box-sizing:border-box}
html,body{min-height:100%}

/* ── hình nền ────────────────────────────────────────────────────────
   Canvas nằm dưới cùng, KHÔNG thay nền của body: body vẫn sơn --paper để
   trang còn một cái nền tử tế trong lúc canvas chưa vẽ xong, và cả khi JS
   chết hẳn. Nền là thứ trang trí — nó không được phép là lý do trang trắng.
   ─────────────────────────────────────────────────────────────────── */
#bg{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:0;pointer-events:none;
  opacity:0;transition:opacity .7s var(--ease-out);
}
#bg.on{opacity:1}
.wrap{position:relative;z-index:1}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right))
          max(28px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
}
.ic{display:block;flex:none}
.wrap{max-width:880px;margin:0 auto}

/* ── đầu trang ───────────────────────────────────────────────────────── */
header{margin:8px 0 30px}
.brand{display:flex;align-items:center;gap:13px}
.brand .mark{
  width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  background:var(--turf);color:#fff;border:2.5px solid var(--ink);box-shadow:var(--shadow);
  /* Con chó lao TỪ TRÁI vào, đúng chiều nó đang chạy. Lao ngược chiều mũi thì
     mắt đọc ra là bị giật lùi chứ không phải đang phóng tới. */
  animation:markIn .52s var(--ease-pop) var(--t0) backwards;
}
@keyframes markIn{
  from{opacity:0;transform:translateX(-22px) rotate(-10deg) scale(.8)}
}
h1{
  font-size:clamp(26px,4.6vw,38px);line-height:1.05;letter-spacing:-.025em;margin:0;
  animation:riseIn .5s var(--ease-out) calc(var(--t0) + .08s) backwards;
}
/* Chữ hai tông: "Race" mang màu sân cỏ, nên tên sản phẩm và cái sân sau lưng
   nó là cùng một thứ, không phải hai thứ tình cờ đứng cạnh nhau. */
h1 .turf{color:var(--turf)}
.lede{
  color:var(--ink-2);margin:14px 0 0;max-width:56ch;
  animation:riseIn .5s var(--ease-out) calc(var(--t0) + .16s) backwards;
}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}}

.eyebrow{
  font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin:34px 0 12px;
  animation:riseIn .5s var(--ease-out) calc(var(--t0) + .24s) backwards;
}

/* ── thẻ chọn trò chơi ───────────────────────────────────────────────
   Ba tầng, tách bạch để mỗi tầng lo một việc:
     .pick    bật vào màn hình, so le nhau theo --n
     .bob     thở nhẹ lúc nằm yên, để màn hình không chết
     .card    chính cái decal — nghiêng, đổ bóng cứng, nhấc lên khi trỏ vào
   Gộp cả ba vào một phần tử thì animation thở sẽ ghi đè transform của hover.
   ─────────────────────────────────────────────────────────────────── */
.picker{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:660px){.picker{grid-template-columns:1fr 1fr}}

.pick{
  padding:0;background:none;border:0;font:inherit;color:inherit;text-align:left;
  cursor:pointer;border-radius:20px;
  /* Thời lượng và độ trễ nằm CHUNG một khai báo. Tách ra hai dòng thì phần
     treo vào --t0 rơi ra khỏi tầm mắt của cửa kiểm, và một hôm nào đó ai xoá
     dòng dưới thì thẻ tự chạy theo nhịp riêng mà không cửa nào kêu. */
  animation:pop .52s var(--ease-pop) calc(var(--t0) + .32s + var(--n) * .09s) backwards;
}
.pick:focus-visible{outline:3px solid var(--lure);outline-offset:4px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}}

.bob{display:block;animation:bob 5.5s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes bob{50%{transform:translateY(-5px)}}

.card{
  --c:var(--turf);
  position:relative;display:flex;flex-direction:column;align-items:center;
  gap:10px;padding:30px 20px 24px;border-radius:19px;min-height:280px;justify-content:center;
  background:var(--surface);border:2.5px solid var(--ink);
  box-shadow:var(--shadow-lg);
  transform:rotate(var(--rot,0deg));
  transition:transform .16s var(--ease-pop), box-shadow .16s var(--ease-out), border-color .16s;
}
/* Đổ bóng đi cùng độ cao: nhấc lên thì bóng DÀI ra, ấn xuống thì bóng cụt lại.
   Chỉ dịch tấm thẻ mà bóng đứng yên thì nó trượt trên mặt giấy chứ không rời
   khỏi mặt giấy — đó là chỗ mà cảm giác "decal dán" mất đi. */
.pick:hover .card,.pick:focus-visible .card{
  transform:rotate(0deg) translateY(-6px) scale(1.03);
  box-shadow:0 12px 0 var(--ink);
  border-color:var(--c);
}
.pick:hover .hero,.pick:focus-visible .hero{transform:scale(1.07) rotate(-5deg)}
.pick:active .card{
  transform:rotate(0deg) translateY(3px) scale(.965);
  box-shadow:0 2px 0 var(--ink);
  transition-duration:.08s;   /* ấn xuống phải NHANH hơn nhả ra, mới ra sức nặng */
}
.pick:hover .bob,.pick:focus-visible .bob{animation-play-state:paused}

/* Cú phóng vào game. Lấy đà → khung va chạm → theo đà.
   Tiếng và rung hẹn đúng vào mốc 38% (≈130ms), không phải lúc bấm: bấm là lúc
   người ta RA LỆNH, va chạm là lúc màn hình TRẢ LỜI, và tai bắt được độ lệch
   giữa hai mốc đó ngay cả khi mắt không gọi tên được. */
.pick.go{pointer-events:none}
.pick.go .card{animation:launch .36s var(--ease-pop) forwards}
.pick.go .bob{animation-play-state:paused}
@keyframes launch{
  0%{transform:rotate(0) translateY(4px) scale(.95)}
  38%{transform:rotate(0) translateY(-12px) scale(1.07)}
  100%{transform:rotate(0) translateY(-6px) scale(1.03)}
}

/* Icon là ngôi sao của thẻ: to, có nền tròn màu của trò chơi. */
.card .hero{
  width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  transition:transform .2s var(--ease-pop);
  background:color-mix(in srgb, var(--c) 14%, var(--surface));
  border:2.5px solid var(--ink);color:var(--c);
}
.card .hero .ic{width:52px;height:52px;stroke-width:2.1}
.card h2{font-size:20px;margin:2px 0 0;letter-spacing:-.01em}
.card p{margin:0;font-size:14px;color:var(--ink-2);text-align:center;max-width:26ch}

.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.chip{
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:3px 9px;border-radius:99px;
  background:var(--surf-2);border:1.5px solid var(--line);color:var(--ink-2);
}
.card .kbd{
  position:absolute;top:9px;left:11px;
  font:600 11px/1 ui-monospace,Consolas,monospace;
  padding:4px 7px;border-radius:6px;
  background:var(--surf-2);border:1.5px solid var(--line);color:var(--ink-3);
}
/* Mũi tên "vào" hiện khi trỏ vào — thẻ là một hành động, không phải lựa chọn. */
.card .tick{
  position:absolute;top:9px;right:11px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:var(--c);color:#fff;
  border:2.5px solid var(--ink);opacity:0;transform:scale(.5) rotate(-25deg);
  transition:opacity .16s, transform .22s var(--ease-pop);
}
.pick:hover .tick,.pick:focus-visible .tick{opacity:1;transform:scale(1) rotate(0)}

.hint{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}

.ghost{
  display:inline-flex;align-items:center;gap:8px;
  font:600 14px/1 inherit;min-height:44px;padding:12px 16px;border-radius:11px;
  background:var(--surface);color:var(--ink-2);border:2px solid var(--line);
  text-decoration:none;cursor:pointer;
  transition:transform .12s var(--ease-pop),border-color .14s;
}
.ghost:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.ghost:active{transform:translateY(1px)}
.ghost:focus-visible{outline:3px solid var(--lure);outline-offset:3px}

/* Chân trang là một TẤM GIẤY, không phải chữ thả thẳng lên nền.
   Đo trên chính hình nền vừa vẽ: ở dải này nền là cỏ sẫm, và chữ --ink-3 rơi
   xuống 1,0:1 — tức là mất hẳn. Trước khi có hình nền thì nó nằm trên --paper
   và được 3,8:1; giờ nằm trên --surface đục nên lên 4,4:1, tức còn khá hơn cũ.
   Một hình nền nuốt mất chữ là một hình nền hỏng, dù nó đẹp tới đâu. */
footer{
  margin:34px 0 8px;padding:14px 18px;
  border:2px solid var(--line);border-radius:14px;
  background:var(--surface);box-shadow:var(--shadow);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  font-size:13px;color:var(--ink-3);
  animation:riseIn .5s var(--ease-out) calc(var(--t0) + .56s) backwards;
}

/* ── màn mở và chuyển cảnh ────────────────────────────────────────────
   #veil tan bằng animation THUẦN CSS: JS chết ở đâu thì trang vẫn hiện ra.
   ─────────────────────────────────────────────────────────────────── */
#veil{
  position:fixed;inset:0;z-index:999;pointer-events:none;
  background:var(--paper);display:grid;place-items:center;
  animation:veilOut .46s var(--ease-out) .2s forwards;
}
#veil.gone{animation:none;opacity:0;visibility:hidden}
@keyframes veilOut{to{opacity:0;visibility:hidden}}
#veil .bootMark{
  width:86px;height:86px;border-radius:22px;display:grid;place-items:center;
  background:var(--turf);color:#fff;border:3px solid var(--ink);box-shadow:var(--shadow-lg);
  animation:bootPop .5s var(--ease-pop) backwards;
}
@keyframes bootPop{from{opacity:0;transform:scale(.62) rotate(-12deg)}}

#wash{
  position:fixed;inset:0;z-index:1000;pointer-events:none;
  opacity:0;transition:opacity .26s var(--ease-snap);
}
#wash.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  /* Ghìm cả transition, không chỉ animation: #bg mờ dần bằng transition nên
     mục *{animation-duration} ở trên không với tới nó. */
  .card,.ghost,.hero,#bg{transition-duration:.06s}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="veil"><span class="bootMark" id="bootMark"></span></div>
<div id="wash"></div>

<div class="wrap">

  <header>
    <div class="brand">
      <span class="mark" id="brandMark"></span>
      <h1>Order <span class="turf">Race</span></h1>
    </div>
    <p class="lede">
      Công cụ quay thưởng nội bộ. Chọn một trò chơi để vào — danh sách và giải thưởng nhập ở
      ngay trong trò đó. Kết quả do thuật toán chốt trước khi trò chơi bắt đầu.
    </p>
  </header>

  <p class="eyebrow">Chọn trò chơi</p>
  <div class="picker" id="picker"></div>

  <footer>
    <button class="ghost" id="mute" type="button"></button>
    <span>Phím tắt: <b>1</b> · <b>2</b> vào thẳng trò chơi.</span>
  </footer>

</div>

<script>
"use strict";
/* INJECT:HUB */

(function () {

const GAMES = [
  {
    id: "race",
    href: "race.html",
    icon: "race",
    color: "var(--turf)",
    tint: "#0f7a4f",   // giá trị thật của --turf; canvas không đọc được biến CSS
    wash: "#0b1a12",
    rot: "-1.4deg",
    name: "Đường đua",
    desc: "Một cuộc đua 40 giây, ai về đích trước thì trúng.",
    chips: ["40 giây", "top-K về đích", "30 – 150 người"],
  },
  {
    id: "redlight",
    href: "redlight.html",
    icon: "referee",
    color: "var(--lure)",
    tint: "#dd9c0c",   // giá trị thật của --lure
    wash: "#1b1405",
    rot: "1.6deg",
    name: "SquidGame",
    desc: "Trọng tài quay mặt là ai nhúc nhích bị loại. Ai sống sót tới cuối thì trúng.",
    chips: ["60 – 80 giây", "loại dần", "30 – 150 người"],
  },
];

const $ = (id) => document.getElementById(id);
const picker = $("picker");

// Thiết lập không nằm ở đây nữa — mỗi trò chơi tự nhập lấy. Nhưng nếu quản trò
// vừa từ một trò bấm sang thì thiết lập của trò đó được MANG THEO qua phần băm
// URL, và chuyển tiếp nguyên vẹn sang trò được chọn. Trang này không đọc, không
// sửa, chỉ chuyển tiếp — nhờ vậy đổi trò giữa buổi không phải dán lại 150 tên.
const carried = decodeHandoff(location.hash) ? location.hash : "";

// Cỡ gần bằng cả huy hiệu: khoảng đệm đã nằm sẵn trong khung nhìn của logo,
// nên thu nhỏ thêm ở đây chỉ tạo ra một vành xanh rỗng quanh con chó.
$("brandMark").innerHTML = logoMark(44);
$("bootMark").innerHTML = logoMark(74);

// Sàn phản hồi khi chạm: một bộ nghe cho mọi thứ bấm được, kể cả thẻ chọn trò
// chơi vốn được dựng bằng JS sau khi trang đã chạy.
audio.restoreMuted();
installTapFeedback(audio, buzz);

const muteBtn = $("mute");
function paintMute() {
  muteBtn.innerHTML = icon(audio.muted ? "soundOff" : "soundOn", 17) +
    "<span>" + (audio.muted ? "Đang tắt tiếng" : "Đang bật tiếng") + "</span>";
}
muteBtn.addEventListener("click", () => { audio.setMuted(!audio.muted); paintMute(); });
paintMute();

// ---------------------------------------------------------------- hình nền
// Cả khối này bọc trong "nếu có canvas". Hình nền là trang trí — máy nào không
// dựng được ngữ cảnh 2D thì trang vẫn phải mở ra bình thường trên nền --paper.
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const bg = $("bg");
const bgCtx = bg.getContext ? bg.getContext("2d") : null;

if (bgCtx) {
  const blobs = bakeBlobs((w, h) => {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    return c;
  });

  let bgW = 0, bgH = 0, bgDpr = 1;
  let tint = null, amt = 0, want = 0;

  function fitBg() {
    // dpr chặn ở 2: trên màn 3x thì tấm ảnh to gấp 2,25 lần mà mắt không phân
    // biệt được ở một hình nền mờ như thế này.
    bgDpr = Math.min(2, window.devicePixelRatio || 1);
    bgW = bg.clientWidth || window.innerWidth;
    bgH = bg.clientHeight || window.innerHeight;
    bg.width = Math.floor(bgW * bgDpr);
    bg.height = Math.floor(bgH * bgDpr);
  }

  function paintBg(nowSec) {
    bgCtx.setTransform(bgDpr, 0, 0, bgDpr, 0, 0);
    drawBackdrop(bgCtx, blobs, bgW, bgH, nowSec, { accent: tint, accentAmt: amt });
  }

  fitBg();
  paintBg(0);
  bg.classList.add("on");

  if (REDUCED) {
    // Đứng hẳn. Vẽ lại đúng khi có việc thật: đổi cỡ cửa sổ, hoặc đổi thẻ đang
    // trỏ vào. Không vòng lặp, không hẹn giờ, không tốn gì lúc nằm yên.
    window.addEventListener("resize", () => { fitBg(); paintBg(0); });
    window.__bgRepaint = () => { amt = want; paintBg(0); };
  } else {
    let running = true;
    let t0 = performance.now();
    window.addEventListener("resize", fitBg);

    // Tab bị ẩn thì rAF vẫn có thể bị gọi thưa chứ không dừng hẳn. Dừng tay
    // cho chắc: quản trò mở trang này rồi chuyển sang slide cả buổi.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { running = false; return; }
      running = true;
      t0 = performance.now() - lastSec * 1000;
      requestAnimationFrame(frame);
    });

    let lastSec = 0;
    function frame(now) {
      if (!running) return;
      lastSec = (now - t0) / 1000;
      // Ngả màu đi tới đích một cách mềm, không nhảy cóc.
      amt += (want - amt) * 0.09;
      paintBg(lastSec);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    window.__bgRepaint = () => {};
  }

  window.__bgTint = (hex) => {
    tint = hex;
    want = hex ? 1 : 0;
    window.__bgRepaint();
  };
} else {
  window.__bgTint = () => {};
}

// Bấm bất kỳ đâu là bỏ qua màn mở — nó ngắn, nhưng quản trò mở đi mở lại nhiều
// lần trong một buổi và không ai muốn xem lại cùng một hoạt cảnh mỗi lần.
addEventListener("pointerdown", () => skipBoot($("veil")), { once: true });

// ---------------------------------------------------------------- thẻ chọn
GAMES.forEach((g, i) => {
  const b = document.createElement("button");
  b.className = "pick";
  b.type = "button";
  b.style.setProperty("--n", i);
  b.setAttribute("aria-label", "Vào " + g.name);
  b.innerHTML =
    '<span class="bob" style="--bd:' + (i * 0.7) + 's">' +
      '<span class="card" style="--c:' + g.color + ';--rot:' + g.rot + '">' +
        '<span class="kbd">' + (i + 1) + '</span>' +
        '<span class="tick">' + icon("play", 14) + '</span>' +
        '<span class="hero">' + icon(g.icon, 52) + '</span>' +
        '<h2>' + g.name + '</h2>' +
        '<p>' + g.desc + '</p>' +
        '<span class="chips">' + g.chips.map((c) => '<span class="chip">' + c + '</span>').join("") + '</span>' +
      '</span>' +
    '</span>';
  b.dataset.tap = "primary";
  b.addEventListener("click", () => launch(g, b));
  // Sân ngả về màu của trò đang trỏ vào — đúng màu sẽ rửa màn khi bấm, nên cú
  // chuyển cảnh bắt đầu từ trước khi ngón tay hạ xuống. Bàn phím cũng tính:
  // đi bằng Tab thì cũng phải thấy đúng thứ mà con chuột thấy.
  b.addEventListener("pointerenter", () => window.__bgTint(g.tint));
  b.addEventListener("focus", () => window.__bgTint(g.tint));
  b.addEventListener("pointerleave", () => window.__bgTint(null));
  b.addEventListener("blur", () => window.__bgTint(null));
  picker.append(b);
});

// ------------------------------------------------------------------ vào game
// Cú phóng dài 360ms, khung va chạm ở mốc 38% — xem @keyframes launch.
const HIT = REDUCED ? 0 : 0.36 * 0.38;

function launch(game, card) {
  // Rửa màn bằng đúng màu của trò chơi sắp vào, rồi trang đích tan tấm phủ cùng
  // màu đó ra. Hai tài liệu khác nhau nhưng đọc thành một cú chuyển cảnh liền.
  const target = game.href + carried;

  // Ba kênh, cùng hẹn vào một mốc: hình nảy lên, tiếng rít, tay rung. Thiếu một
  // kênh là cú bấm đọc ra thành hỏng, kể cả khi hai kênh kia đúng.
  if (card) card.classList.add("go");
  audio.tone({ freq: audio.vary(240), sweepTo: 760, dur: 0.32,
               type: "triangle", gain: 0.15, at: HIT });
  if (!REDUCED) setTimeout(() => buzz(18), HIT * 1000);

  // Rửa màn bắt đầu NGAY SAU khung va chạm, không cùng lúc: cùng lúc thì tấm
  // rửa nuốt mất cú nảy, và công dựng cú nảy thành công cốc.
  setTimeout(() => washOut($("wash"), game.wash, () => { location.href = target; }),
             REDUCED ? 0 : HIT * 1000 + 70);
}

document.addEventListener("keydown", (e) => {
  // Phím tắt cũng phải thấy đúng cú nảy mà con chuột thấy — nếu không thì đi
  // bằng bàn phím là một trải nghiệm hạng hai.
  const cards = picker.children;
  if (e.key === "1") { e.preventDefault(); launch(GAMES[0], cards[0]); }
  else if (e.key === "2") { e.preventDefault(); launch(GAMES[1], cards[1]); }
});

})();
</script>
